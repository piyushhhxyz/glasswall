[project]
name = "pii-redactor"
version = "1.0.0"
description = "Structure-preserving PII redaction for DOCX, built for RL-environment data sanitisation"
requires-python = ">=3.11"
dependencies = ["python-docx>=1.1.2", "lxml>=5.0"]

[project.optional-dependencies]
ner = ["spacy>=3.7"]
# The S3 before/after verifier UI. Optional so the redactor stays dependency-light.
s3 = ["boto3>=1.34", "fastapi>=0.110", "uvicorn[standard]>=0.29"]
# Parsers for the heavier formats the viewer can read. Each is imported lazily
# and degrades to extracted strings with a note when absent, so this is additive.
formats = ["pypdf>=4.0", "openpyxl>=3.1", "python-pptx>=0.6", "pyarrow>=15.0"]
dev = [
    "pytest>=8.0", "pillow>=10.0", "httpx>=0.27",
    "boto3>=1.34", "fastapi>=0.110", "uvicorn[standard]>=0.29",
    "pypdf>=4.0", "openpyxl>=3.1", "python-pptx>=0.6", "pyarrow>=15.0",
]

[project.scripts]
redact = "pii_redactor.cli:main"
pii-verify = "pii_verifier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["pii_redactor", "pii_verifier"]
